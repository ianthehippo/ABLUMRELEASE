<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta property="og:description" content="Something powerful is coming.">
<meta property="og:image" content="">

<meta name="twitter:card" content="summary">

  <title>Album Release</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    .album-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at top, #3b0000, transparent 35%),
        linear-gradient(180deg, #050505, #111);
      opacity: 0;
      transition: opacity 2s ease;
    }

    .album-page.revealed {
      opacity: 1;
    }

    .album-cover {
      width: 300px;
      max-width: 85%;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.45);
      margin-bottom: 25px;
    }

    h1 {
      font-size: 4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #ccc;
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .release {
      font-size: 1rem;
      color: #ff4d4d;
      letter-spacing: 2px;
    }

    .listen-btn {
      margin-top: 30px;
      padding: 14px 30px;
      border: 2px solid #ff2b2b;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .listen-btn:hover {
      background: #ff2b2b;
      box-shadow: 0 0 25px #ff2b2b;
    }

    #countdownOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #330000, #000 65%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    #countdownOverlay h2 {
      font-size: 3.5rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 15px;
    }

    #countdownOverlay p {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    #timer {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 20px;
      min-width: 110px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
    }

    .time-box span {
      display: block;
      font-size: 2.5rem;
      font-weight: bold;
      color: #ff3b3b;
    }

    .time-box small {
      color: #ccc;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .locked {
      margin-top: 30px;
      color: #ff4d4d;
      letter-spacing: 3px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.7rem;
      }

      #countdownOverlay h2 {
        font-size: 2.2rem;
      }

      .time-box {
        min-width: 90px;
        padding: 15px;
      }
    }
    .album-title {
  font-size: 5rem;
  font-weight: 900;
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-bottom: 15px;
  text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
}

.release-date {
  color: #ff4444;
  letter-spacing: 3px;
  margin-bottom: 35px;
  text-transform: uppercase;
}

.tracklist {
  margin-top: 70px;
  max-width: 500px;
  width: 100%;
}

.tracklist h2 {
  margin-bottom: 20px;
  letter-spacing: 4px;
  color: #ff4444;
}

.track {
  padding: 12px;
  margin: 8px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  transition: 0.3s;
}

.track:hover {
  background: rgba(255,255,255,0.1);
}

.album-cover {
  width: 400px;
  max-width: 90%;
  border-radius: 20px;
  box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
  margin-bottom: 30px;
}

@media (max-width: 768px) {
  .album-title {
    font-size: 3rem;
  }
}
  </style>
</head>

<body>

  <div id="countdownOverlay">
    <h2>06 • 12 • 26</h2>
    <p>Something powerful is coming.</p>

    <div id="timer">
      <div class="time-box">
        <span id="days">00</span>
        <small>Days</small>
      </div>
      <div class="time-box">
        <span id="hours">00</span>
        <small>Hours</small>
      </div>
      <div class="time-box">
        <span id="minutes">00</span>
        <small>Minutes</small>
      </div>
      <div class="time-box">
        <span id="seconds">00</span>
        <small>Seconds</small>
      </div>
    </div>

    <div class="locked">CLASSIFIED UNTIL RELEASE</div>
  </div>

  <main class="album-page">

    <!-- REPLACE WITH YOUR REAL ALBUM COVER URL LATER -->
    <img
  class="album-cover"
  id="albumCover"
  src="https://raw.githubusercontent.com/ianthehippo/ABLUMRELEASE/refs/heads/main/MMJM.png"
  alt="Coming Soon"
/>

    <h1 class="album-title">POWER FOREVER</h1>

    <p class="subtitle">
      The new album is finally Coming.
    </p>

    <p class="release-date">
      Release Date ?
    </p>

    <a href="#" class="listen-btn">
      LISTEN SOON
    </a>

    <div class="tracklist">
      <h2>TRACKLIST</h2>

      <div class="track">01 • The Story Starts Here</div>
      <div class="track">02 • ?</div>
      <div class="track">03 • ?</div>
      <div class="track">04 • ?</div>
      <div class="track">05 • ?</div>
      <div class="track">06 • ?</div>
      <div class="track">07 • ?</div>
      <div class="track">08 • ?</div>
    </div>

</main>

  <script>
    const releaseDate = new Date("June 12, 2026 00:00:00").getTime();
const REAL_COVER =
"https://raw.githubusercontent.com/ianthehippo/ABLUMRELEASE/refs/heads/main/power.png";

const albumCover = document.getElementById("albumCover");
    const overlay = document.getElementById("countdownOverlay");
    const albumPage = document.querySelector(".album-page");

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance <= 0) {

  albumCover.src = REAL_COVER;
  albumCover.alt = "POWER FOREVER Album Cover";

  overlay.style.display = "none";
  document.body.style.overflow = "auto";
  albumPage.classList.add("revealed");

  return;
}

      document.body.style.overflow = "hidden";

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("days").textContent = days.toString().padStart(2, "0");
      document.getElementById("hours").textContent = hours.toString().padStart(2, "0");
      document.getElementById("minutes").textContent = minutes.toString().padStart(2, "0");
      document.getElementById("seconds").textContent = seconds.toString().padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
